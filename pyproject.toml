[project]
name = "personality-kg-ingest"
version = "0.1.0"
description = "PDF ingestion pipeline for Knowledge Graph and Personality extraction"
authors = [{name = "Your Name"}]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23.0",
    "regex>=2023.12.25",
    "python-slugify>=8.0.1",
    "tqdm>=4.66.1",
    "pillow>=10.2.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "black>=23.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
